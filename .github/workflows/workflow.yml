name: Publish Python SDK to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      # release-please component tag (see release-please-config.json).
      - 'sdk-python-v*'
      # Legacy prefix, kept so tags cut before the v2 release tooling still publish.
      - 'apilens-sdk-v*'

permissions: {}

jobs:
  build:
    name: Build sdk wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdk-dist
          path: packages/sdk-python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    environment:
      name: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC); no long-lived token
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-sdk-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
