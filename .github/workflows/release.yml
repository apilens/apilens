# Release automation (inactive until v2 is merged into main).
#
# release-please keeps one release PR per component (platform, AI service,
# Helm chart, SDKs) from Conventional Commit titles. Merging a release PR tags
# it; for the platform (`v*`) this workflow then publishes binaries with
# GoReleaser and the container images via images.yml. SDK tags
# (sdk-python-v*, sdk-java-v*) are published by their own workflows.
#
# NOTE: tags created with GITHUB_TOKEN do not trigger other workflows, so the
# platform image build is invoked here as a reusable workflow. The SDK publish
# workflows need a release-please token with workflow-trigger rights
# (RELEASE_PLEASE_TOKEN, a fine-grained PAT or GitHub App token) to fire on
# their tags; without it they can be run manually via workflow_dispatch.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create release tags and GitHub releases
      pull-requests: write # open and update release PRs
    outputs:
      platform_released: ${{ steps.rp.outputs.release_created }}
      platform_tag: ${{ steps.rp.outputs.tag_name }}
      platform_version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  binaries:
    name: GoReleaser
    needs: release-please
    if: needs.release-please.outputs.platform_released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # upload archives to the GitHub release
      id-token: write # keyless cosign signing of checksums (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.platform_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Container images
    needs: release-please
    if: needs.release-please.outputs.platform_released == 'true'
    permissions:
      contents: read
      packages: write # push release images to GHCR
      id-token: write # keyless signing and attestations
      attestations: write # record SBOM and provenance attestations
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.release-please.outputs.platform_tag }}
      version: ${{ needs.release-please.outputs.platform_version }}
