# GoReleaser (OSS) config for the apilens binary. Run by .github/workflows/release.yml
# after release-please tags a platform release (vX.Y.Z). release-please owns the
# changelog and the GitHub release; GoReleaser only attaches artifacts.
# Container images are built by .github/workflows/images.yml, not here.
version: 2

project_name: apilens

before:
  hooks:
    - go mod download

builds:
  - id: apilens
    main: ./cmd/apilens
    binary: apilens
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/apilens/apilens/internal/platform/buildinfo.Version={{ .Version }}
      - -X github.com/apilens/apilens/internal/platform/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/apilens/apilens/internal/platform/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: apilens
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive (requires syft on PATH).
sboms:
  - artifacts: archive

# Keyless cosign signature (Sigstore bundle) over the checksums file, which
# covers every archive. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/apilens/apilens/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

changelog:
  disable: true

release:
  # release-please already created the release; only upload assets.
  mode: keep-existing
  github:
    owner: apilens
    name: apilens
