version: "2"
sql:
  - engine: postgresql
    # goose migration files double as sqlc's schema (Down sections are ignored).
    schema: internal/migrations/postgres
    queries: internal/controlplane/store/queries
    gen:
      go:
        package: db
        out: internal/controlplane/store/db
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
