# APILens — self-hosted, all-in-one.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --wait
#   docker compose run --rm --entrypoint /apilens apilens seed
#
# Then sign up on the dashboard at http://localhost:3000. With the default
# `log` email provider the sign-in code is in `docker compose logs apilens`.
#
# Exposes only the API port (8080: ingest, identity, dashboard API) and the
# dashboard (3000). Terminate TLS in front of both (Caddy, nginx, a cloud load
# balancer, ...).
# Datastores (and SpiceDB) are reachable only on the internal compose network.
name: apilens

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Hardening shared by the APILens containers (the binary needs no writable
# filesystem and no Linux capabilities).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-apilens-image: &apilens-image
  image: ghcr.io/apilens/apilens:${APILENS_VERSION:-edge}
  # `docker compose up --build` builds from source; otherwise the published
  # image is used.
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile

x-spicedb-image: &spicedb-image
  image: ghcr.io/authzed/spicedb:v1.57.0@sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd

# SpiceDB keeps its data in its own `spicedb` database on the shared Postgres.
x-spicedb-env: &spicedb-env
  SPICEDB_DATASTORE_ENGINE: postgres
  SPICEDB_DATASTORE_CONN_URI: postgres://apilens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/spicedb?sslmode=disable
  SPICEDB_LOG_FORMAT: json
  # No usage telemetry to authzed.com.
  SPICEDB_TELEMETRY_ENDPOINT: ""

x-apilens-env: &apilens-env
  APILENS_LOG__LEVEL: ${APILENS_LOG_LEVEL:-info}
  APILENS_LOG__FORMAT: json
  APILENS_POSTGRES__URL: postgres://apilens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/apilens?sslmode=disable
  APILENS_CLICKHOUSE__ADDR: clickhouse:9000
  APILENS_CLICKHOUSE__DATABASE: apilens
  APILENS_CLICKHOUSE__USERNAME: apilens
  APILENS_CLICKHOUSE__PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  APILENS_VALKEY__ADDR: valkey:6379
  APILENS_VALKEY__PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
  APILENS_SINK__MODE: direct
  APILENS_OTEL__ENDPOINT: ${APILENS_OTEL_ENDPOINT:-}
  # Identity (see .env.example). public_ui_url and the default WebAuthn origin
  # follow the dashboard URL.
  APILENS_IDENTITY__KEY_ENCRYPTION_KEY: ${APILENS_IDENTITY__KEY_ENCRYPTION_KEY:?set APILENS_IDENTITY__KEY_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  APILENS_IDENTITY__ISSUER: ${APILENS_IDENTITY__ISSUER:-http://localhost:8080}
  APILENS_IDENTITY__PUBLIC_UI_URL: ${APILENS_PUBLIC_URL:-http://localhost:3000}
  APILENS_IDENTITY__COOKIE_DOMAIN: ${APILENS_IDENTITY__COOKIE_DOMAIN:-}
  APILENS_IDENTITY__ACCESS_TOKEN_TTL: ${APILENS_IDENTITY__ACCESS_TOKEN_TTL:-15m}
  APILENS_IDENTITY__REFRESH_TOKEN_TTL: ${APILENS_IDENTITY__REFRESH_TOKEN_TTL:-720h}
  APILENS_IDENTITY__REFRESH_TOKEN_TTL_SHORT: ${APILENS_IDENTITY__REFRESH_TOKEN_TTL_SHORT:-24h}
  APILENS_IDENTITY__EMAIL_CODE_TTL: ${APILENS_IDENTITY__EMAIL_CODE_TTL:-15m}
  APILENS_IDENTITY__EMAIL_CODE_MAX_ATTEMPTS: ${APILENS_IDENTITY__EMAIL_CODE_MAX_ATTEMPTS:-5}
  APILENS_IDENTITY__PRE_AUTH_TTL: ${APILENS_IDENTITY__PRE_AUTH_TTL:-5m}
  APILENS_IDENTITY__RECOVERY_DELAY: ${APILENS_IDENTITY__RECOVERY_DELAY:-24h}
  APILENS_IDENTITY__WEBAUTHN__RP_ID: ${APILENS_IDENTITY__WEBAUTHN__RP_ID:-localhost}
  APILENS_IDENTITY__WEBAUTHN__RP_NAME: ${APILENS_IDENTITY__WEBAUTHN__RP_NAME:-APILens}
  APILENS_IDENTITY__WEBAUTHN__ORIGINS: ${APILENS_IDENTITY__WEBAUTHN__ORIGINS:-${APILENS_PUBLIC_URL:-http://localhost:3000}}
  APILENS_IDENTITY__CORS_ORIGINS: ${APILENS_IDENTITY__CORS_ORIGINS:-}
  APILENS_IDENTITY__OAUTH__GOOGLE__CLIENT_ID: ${APILENS_IDENTITY__OAUTH__GOOGLE__CLIENT_ID:-}
  APILENS_IDENTITY__OAUTH__GOOGLE__CLIENT_SECRET: ${APILENS_IDENTITY__OAUTH__GOOGLE__CLIENT_SECRET:-}
  APILENS_IDENTITY__OAUTH__GITHUB__CLIENT_ID: ${APILENS_IDENTITY__OAUTH__GITHUB__CLIENT_ID:-}
  APILENS_IDENTITY__OAUTH__GITHUB__CLIENT_SECRET: ${APILENS_IDENTITY__OAUTH__GITHUB__CLIENT_SECRET:-}
  # Authorization (SpiceDB on the compose network; plaintext gRPC).
  APILENS_AUTHZ__ENDPOINT: spicedb:50051
  APILENS_AUTHZ__PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY:?set SPICEDB_PRESHARED_KEY in .env}
  APILENS_AUTHZ__INSECURE: "true"
  APILENS_AUTHZ__CACHE_TTL: ${APILENS_AUTHZ__CACHE_TTL:-5s}
  # Email (see .env.example). `log` writes messages to the log, sends nothing.
  APILENS_EMAIL__PROVIDER: ${APILENS_EMAIL__PROVIDER:-log}
  APILENS_EMAIL__HOST: ${APILENS_EMAIL__HOST:-}
  APILENS_EMAIL__PORT: ${APILENS_EMAIL__PORT:-587}
  APILENS_EMAIL__USERNAME: ${APILENS_EMAIL__USERNAME:-}
  APILENS_EMAIL__PASSWORD: ${APILENS_EMAIL__PASSWORD:-}
  APILENS_EMAIL__FROM: ${APILENS_EMAIL__FROM:-}
  APILENS_EMAIL__REPLY_TO: ${APILENS_EMAIL__REPLY_TO:-}
  APILENS_EMAIL__TLS: ${APILENS_EMAIL__TLS:-starttls}
  APILENS_EMAIL__TIMEOUT: ${APILENS_EMAIL__TIMEOUT:-10s}

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    restart: unless-stopped
    environment:
      POSTGRES_DB: apilens
      POSTGRES_USER: apilens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # SpiceDB's Watch API needs commit timestamps.
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apilens -d apilens"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.33.10@sha256:1c0b76ac42e16b4eeb0be84013c67269b660701971d29bab9ad0d01b0ba6c10d
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: apilens
      CLICKHOUSE_USER: apilens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-4g}
    logging: *logging

  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: ${VALKEY_MEMORY_LIMIT:-256m}
    logging: *logging

  # One-shot: creates SpiceDB's database on the shared Postgres if missing.
  spicedb-db:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: apilens
      PGDATABASE: apilens
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'spicedb'\" | grep -q 1 || psql -c 'CREATE DATABASE spicedb'"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # One-shot: applies SpiceDB's own datastore migrations, then exits.
  spicedb-migrate:
    <<: [*spicedb-image, *hardened]
    command: ["datastore", "migrate", "head"]
    restart: "no"
    environment:
      <<: *spicedb-env
    depends_on:
      spicedb-db:
        condition: service_completed_successfully
    logging: *logging

  spicedb:
    <<: [*spicedb-image, *hardened]
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *spicedb-env
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_PRESHARED_KEY:?set SPICEDB_PRESHARED_KEY in .env}
    tmpfs:
      - /tmp:size=64m
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${SPICEDB_MEMORY_LIMIT:-512m}
    logging: *logging

  # One-shot: applies the embedded Postgres + ClickHouse migrations and the
  # SpiceDB schema, then exits.
  migrate:
    <<: [*apilens-image, *hardened]
    command: ["migrate"]
    user: "65532:65532"
    restart: "no"
    environment:
      <<: *apilens-env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    logging: *logging

  # `-target=all` runs every role in one process: edge (ingest), query and api
  # (dashboard API) and identity (/api/v1/auth/*), all on port 8080.
  apilens:
    <<: [*apilens-image, *hardened]
    command: ["-target=all"]
    user: "65532:65532"
    restart: unless-stopped
    environment:
      <<: *apilens-env
    ports:
      - "${APILENS_INGEST_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=64m
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/apilens", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${APILENS_MEMORY_LIMIT:-1g}
    logging: *logging

  web:
    image: ghcr.io/apilens/web:${APILENS_VERSION:-edge}
    build:
      context: ../..
      dockerfile: apps/ui/Dockerfile
    restart: unless-stopped
    <<: *hardened
    # Read at runtime by apps/ui/src/lib/env.ts (see apps/ui/README.md).
    environment:
      # Server-side calls to identity and the dashboard API, over the compose
      # network (never exposed to browsers).
      APILENS_API_URL: http://apilens:8080
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Origin users open the dashboard at (links, redirects, cookie scope).
      APILENS_PUBLIC_URL: ${APILENS_PUBLIC_URL:-http://localhost:3000}
      # Public URL of the API (the token issuer): the Google and GitHub sign-in
      # buttons send browsers to its /api/v1/auth/oauth/{provider}/start.
      APILENS_PUBLIC_API_URL: ${APILENS_IDENTITY__ISSUER:-http://localhost:8080}
      # Public URL SDKs and OpenTelemetry exporters send events to, for the
      # onboarding and API key setup snippets.
      APILENS_PUBLIC_INGEST_URL: ${APILENS_PUBLIC_INGEST_URL:-http://localhost:8080}
    ports:
      - "${APILENS_WEB_PORT:-3000}:3000"
    tmpfs:
      - /tmp:size=64m
      # Next.js writes its image/fetch cache here; the web image runs as 65532.
      - /app/apps/ui/.next/cache:size=256m,uid=65532,gid=65532
    depends_on:
      apilens:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-512m}
    logging: *logging

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
