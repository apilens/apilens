# CI override for end-to-end tests. Use together with ci.env:
#
#   docker compose --env-file deploy/compose/ci.env \
#     -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml \
#     up -d --build --wait apilens web
#
# Publishes the ClickHouse HTTP port on localhost so test/e2e can assert rows
# (APILENS_E2E_CLICKHOUSE_HTTP=http://127.0.0.1:8123, user apilens /
# password from ci.env), and sends email over SMTP to a Mailpit sink whose
# API test/e2e and apps/ui/e2e read sign-in codes and invitations from
# (APILENS_E2E_MAILPIT_URL=http://127.0.0.1:8025). Nothing leaves the host.
# The dashboard (web, http://localhost:3000) is for the browser e2e
# (apps/ui/e2e/onboarding.spec.ts).
services:
  clickhouse:
    ports:
      - "127.0.0.1:8123:8123"

  # SMTP sink: holds every email instead of delivering it.
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    ports:
      - "127.0.0.1:${APILENS_E2E_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  apilens:
    environment:
      # Flush quickly so tests don't wait on the batching interval.
      APILENS_SINK__FLUSH_INTERVAL: 100ms
      # A low per-project quota so test/e2e/quota_e2e_test.go can reach the
      # 429 with two full batches; the other e2e tests stay far below it.
      APILENS_INGEST__QUOTA__RECORDS_PER_MINUTE: "2000"
      APILENS_EMAIL__PROVIDER: smtp
      APILENS_EMAIL__HOST: mailpit
      APILENS_EMAIL__PORT: "1025"
      APILENS_EMAIL__TLS: none
      APILENS_EMAIL__FROM: APILens <no-reply@apilens.test>
    depends_on:
      mailpit:
        condition: service_healthy
