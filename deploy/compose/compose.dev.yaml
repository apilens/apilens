# Datastores for local development. Run the Go binary, web and AI apps on the
# host (see Taskfile.yml: `task up`, `task dev`).
#
#   docker compose -f deploy/compose/compose.dev.yaml up -d --wait
#
# Ports are bound to 127.0.0.1 only. Credentials are fixed dev values:
#   Postgres   postgres://apilens:apilens@127.0.0.1:5432/apilens?sslmode=disable
#   ClickHouse native 127.0.0.1:9000, HTTP 127.0.0.1:8123, user apilens / password apilens
#   Valkey     127.0.0.1:6379 (no password)
#   SpiceDB    gRPC 127.0.0.1:50051, preshared key apilens-dev-key (database
#              `spicedb` on the Postgres above)
#   Mailpit    SMTP 127.0.0.1:1025 (no auth, no TLS); UI and API on
#              http://127.0.0.1:8025 — sign-in codes land here
# Matching env for the binary:
#   APILENS_CLICKHOUSE__PASSWORD=apilens APILENS_VALKEY__ADDR=127.0.0.1:6379
#   APILENS_IDENTITY__KEY_ENCRYPTION_KEY=<openssl rand -base64 32> (Taskfile sets a dev key)
#   APILENS_AUTHZ__ENDPOINT=127.0.0.1:50051 APILENS_AUTHZ__PRESHARED_KEY=apilens-dev-key
#   APILENS_AUTHZ__INSECURE=true (Taskfile sets these)
#   APILENS_EMAIL__PROVIDER=smtp APILENS_EMAIL__HOST=127.0.0.1 APILENS_EMAIL__PORT=1025
#   APILENS_EMAIL__TLS=none APILENS_EMAIL__FROM='APILens <no-reply@apilens.local>'
name: apilens-dev

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: apilens
      POSTGRES_USER: apilens
      POSTGRES_PASSWORD: apilens
    # SpiceDB's Watch API needs commit timestamps.
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apilens -d apilens"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.33.10@sha256:1c0b76ac42e16b4eeb0be84013c67269b660701971d29bab9ad0d01b0ba6c10d
    environment:
      CLICKHOUSE_DB: apilens
      CLICKHOUSE_USER: apilens
      CLICKHOUSE_PASSWORD: apilens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user apilens --password apilens --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: creates SpiceDB's database on the shared Postgres if missing.
  spicedb-db:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      PGHOST: postgres
      PGUSER: apilens
      PGDATABASE: apilens
      PGPASSWORD: apilens
    command: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'spicedb'\" | grep -q 1 || psql -c 'CREATE DATABASE spicedb'"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: applies SpiceDB's own datastore migrations.
  spicedb-migrate:
    image: ghcr.io/authzed/spicedb:v1.57.0@sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd
    command: ["datastore", "migrate", "head"]
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://apilens:apilens@postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb-db:
        condition: service_completed_successfully

  # The schema is written by `apilens migrate` (task migrate).
  spicedb:
    image: ghcr.io/authzed/spicedb:v1.57.0@sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd
    command: ["serve"]
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://apilens:apilens@postgres:5432/spicedb?sslmode=disable
      SPICEDB_GRPC_PRESHARED_KEY: apilens-dev-key
      SPICEDB_TELEMETRY_ENDPOINT: ""
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 3s
      timeout: 3s
      retries: 30

  # SMTP sink for sign-in codes and invitations; read them in the web UI or
  # through the HTTP API (/api/v1/messages).
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # M3: optional Kafka profile (Apache Kafka 4.x, KRaft) for the kafka sink.
  # kafka:
  #   image: apache/kafka:4.x
  #   profiles: ["kafka"]
  #   ports: ["127.0.0.1:9092:9092"]

volumes:
  postgres-data:
  clickhouse-data:
