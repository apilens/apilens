# Default values for the APILens chart.
#
# APILens ships ONE image; each enabled entry under `roles` becomes its own
# Deployment running `apilens -target=<role>`. Small installs run the single
# `all` role; larger ones split roles out (e.g. `edge` scaled independently).
#
# Datastores are NOT bundled. Point the chart at Postgres, ClickHouse and
# Valkey you operate (see README: CloudNativePG, Altinity ClickHouse operator,
# valkey-io charts).

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/apilens/apilens
  # Defaults to the chart appVersion.
  tag: ""
  # Optional "sha256:..." digest; takes precedence over tag when set.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# One Deployment per enabled role. Implemented in this release: all, edge,
# identity, api. `all` already runs every implemented role; enable `identity`
# and `api` (with `all` disabled) to scale sign-in and the control-plane API
# separately from `edge`.
roles:
  all:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
  edge:
    enabled: false
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Sign-in, sessions, tokens, OAuth and the email worker (/api/v1/auth/*).
  # Needs secrets key `identity-key-encryption-key`.
  identity:
    enabled: false
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Control-plane API (organizations, projects, apps, API keys).
  api:
    enabled: false
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Planned roles (M3+), not yet available in the binary:
  # writer, processor, query, saml, worker, mcp

# Extra APILENS_* environment variables rendered into the shared ConfigMap.
# Nested keys use a double underscore (APILENS_SINK__BATCH_SIZE -> sink.batch_size).
config:
  APILENS_LOG__LEVEL: info
  APILENS_LOG__FORMAT: json
  APILENS_SINK__MODE: direct
  APILENS_SINK__ACK: flush
  # Days audit events are kept (audit.retention); a daily job deletes older
  # ones. At least 30, or 0 to keep them forever.
  APILENS_AUDIT__RETENTION: 400

# Connection settings for externally operated datastores.
externalPostgres:
  # The connection URL (including password) is read from the secret key
  # `postgres-url`, e.g. postgres://apilens:PASS@pg-rw:5432/apilens?sslmode=require
  maxConns: 20

externalClickHouse:
  # Native protocol addresses (host:9000, or :9440 with secure=true).
  addr:
    - clickhouse:9000
  database: apilens
  username: apilens
  secure: false
  # Set to the cluster name for replicated deployments (ON CLUSTER DDL).
  cluster: ""

externalValkey:
  # Empty disables Valkey (API-key cache invalidation falls back to TTL).
  addr: []
  username: ""

# Identity role settings (rendered as APILENS_IDENTITY__*). Secrets (key
# encryption key, OAuth client secrets) come from the `secrets` block. Other
# identity.* keys (token TTLs, rate limits) can be set through `config`.
identity:
  # Token issuer (`iss`) and base of the OAuth callback URLs: the public URL
  # browsers reach /api/v1/auth/* at. Empty = derived from
  # `ingress.ingestHost` (https when `ingress.tls` is set), else the binary
  # default (http://localhost:8080).
  issuer: ""
  # Origin of the dashboard, used for email links and OAuth redirects.
  # Empty = `web.publicUrl` / `ingress.webHost`.
  publicUiUrl: ""
  # Session cookie domain; empty = host-only.
  cookieDomain: ""
  webauthn:
    # Registrable domain users see (no scheme or port). Empty = the host of
    # the dashboard origin.
    rpId: ""
    rpName: APILens
    # Allowed origins; empty = the dashboard origin.
    origins: []
  # Browser origins allowed to call /api/v1/auth/* cross-origin. Leave empty:
  # the dashboard calls identity server-side.
  corsOrigins: []
  # Reverse proxies (IPs/CIDRs) whose X-Forwarded-For is trusted for the
  # client IP used by the auth rate limits; empty = the TCP peer. Set it to
  # your ingress controller's pod CIDR.
  trustedProxies: []
  # Social sign-in. A provider is enabled when its client ID is set; its
  # secret is read from `oauth-google-client-secret` /
  # `oauth-github-client-secret`. Redirect URI to register:
  # <issuer>/api/v1/auth/oauth/{google|github}/callback
  oauth:
    google:
      clientId: ""
    github:
      clientId: ""

# Transactional email: sign-in codes, invitations, security alerts (rendered as
# APILENS_EMAIL__*). `log` writes each message to the identity (or all) pod log
# instead of sending it. The SMTP password is read from the secret key
# `smtp-password`.
email:
  # log | smtp
  provider: log
  host: ""
  port: 587
  username: ""
  # Sender, e.g. `APILens <no-reply@example.com>`. Required for smtp.
  from: ""
  replyTo: ""
  # starttls (587) | tls (implicit, 465) | none (local relays only)
  tls: starttls
  timeout: 10s

# Authorization (SpiceDB, ADR 0006). Either point `authz.endpoint` at a
# SpiceDB you operate, or set `spicedb.enabled` to run one in-chart. With
# neither, authorization is disabled (`apilens migrate` skips the schema).
authz:
  # External SpiceDB gRPC address (host:port). Must be empty when
  # spicedb.enabled is true.
  endpoint: ""
  # Dial without TLS (only for a plaintext in-cluster SpiceDB). Forced on for
  # the in-chart SpiceDB.
  insecure: false
  # How long a permission check result may be reused (Go duration; 0s = off).
  cacheTTL: 5s

# In-chart SpiceDB: one Deployment + Service; its datastore migrations run as
# an init container. The Postgres datastore URI (a separate database, e.g.
# postgres://apilens:PASS@pg-rw:5432/spicedb?sslmode=require) is read from the
# secret key `spicedb-datastore-uri`. For HA, run the SpiceDB operator instead
# and set `authz.endpoint`.
spicedb:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/authzed/spicedb
    tag: v1.57.0
    digest: "sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Extra environment variables (SPICEDB_* flags) for the SpiceDB container.
  extraEnv: []

secrets:
  # Name of an existing Secret with keys: postgres-url, clickhouse-password,
  # valkey-password (optional), session-secret (required when web is enabled),
  # identity-key-encryption-key (required when the all or identity role runs),
  # smtp-password (optional), oauth-google-client-secret and
  # oauth-github-client-secret (required when that provider's clientId is set),
  # spicedb-preshared-key (required when authz is enabled),
  # spicedb-datastore-uri (required when spicedb.enabled).
  existingSecret: ""
  # Inline values for development ONLY (rendered into a chart-managed Secret
  # when existingSecret is empty).
  postgresUrl: ""
  clickhousePassword: ""
  valkeyPassword: ""
  # Encrypts the dashboard session cookie (at least 32 characters).
  sessionSecret: ""
  # Identity key encryption key: 32 random bytes, base64
  # (openssl rand -base64 32). Encrypts signing keys and TOTP secrets at rest.
  identityKeyEncryptionKey: ""
  # SMTP password (email.provider=smtp).
  smtpPassword: ""
  # OAuth client secrets (identity.oauth.*.clientId set).
  oauthGoogleClientSecret: ""
  oauthGithubClientSecret: ""
  # SpiceDB preshared key (openssl rand -hex 32).
  spicedbPresharedKey: ""
  # Postgres URI of SpiceDB's own database (spicedb.enabled only).
  spicedbDatastoreUri: ""

# Database migrations run as a Helm hook Job (pre-install, pre-upgrade). With
# spicedb.enabled the SpiceDB schema is applied by a second hook Job
# (post-install, post-upgrade), once the in-chart SpiceDB exists.
migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

# Web UI (Next.js, apps/ui).
web:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/apilens/web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  # APILENS_API_URL: backend base URL the UI server calls (identity and the
  # dashboard API). Empty = the in-cluster `identity` role Service when that
  # role is enabled, else the Service of `ingress.ingestRole`.
  apiUrl: ""
  # APILENS_PUBLIC_URL: origin users open the dashboard at. Empty = derived
  # from `ingress.webHost` (https when `ingress.tls` is set).
  publicUrl: ""
  extraEnv: []

# AI/ML service (Python). Disabled until it ships real features (M4).
ai:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/apilens/ai
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Host for the dashboard.
  webHost: ""
  # Host for SDK ingest + API (routed to `ingestRole`).
  ingestHost: ""
  ingestRole: all
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Applied to every role Deployment. When empty and defaultTopologySpread is
# true, pods are spread across zones and nodes (best effort).
topologySpreadConstraints: []
defaultTopologySpread: true

metrics:
  # Adds prometheus.io/* scrape annotations to role pods.
  podAnnotations: true
