# Default values for the APILens chart.
#
# APILens ships ONE image; each enabled entry under `roles` becomes its own
# Deployment running `apilens -target=<role>`. Small installs run the single
# `all` role; larger ones split roles out (e.g. `edge` scaled independently).
#
# Datastores are NOT bundled. Point the chart at Postgres, ClickHouse and
# Valkey you operate (see README: CloudNativePG, Altinity ClickHouse operator,
# valkey-io charts).

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/apilens/apilens
  # Defaults to the chart appVersion.
  tag: ""
  # Optional "sha256:..." digest; takes precedence over tag when set.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# One Deployment per enabled role. Implemented in this release: all, edge.
roles:
  all:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
  edge:
    enabled: false
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Planned roles (M2+), not yet available in the binary:
  # writer, processor, query, api, identity, saml, worker, mcp

# Extra APILENS_* environment variables rendered into the shared ConfigMap.
# Nested keys use a double underscore (APILENS_SINK__BATCH_SIZE -> sink.batch_size).
config:
  APILENS_LOG__LEVEL: info
  APILENS_LOG__FORMAT: json
  APILENS_SINK__MODE: direct
  APILENS_SINK__ACK: flush

# Connection settings for externally operated datastores.
externalPostgres:
  # The connection URL (including password) is read from the secret key
  # `postgres-url`, e.g. postgres://apilens:PASS@pg-rw:5432/apilens?sslmode=require
  maxConns: 20

externalClickHouse:
  # Native protocol addresses (host:9000, or :9440 with secure=true).
  addr:
    - clickhouse:9000
  database: apilens
  username: apilens
  secure: false
  # Set to the cluster name for replicated deployments (ON CLUSTER DDL).
  cluster: ""

externalValkey:
  # Empty disables Valkey (API-key cache invalidation falls back to TTL).
  addr: []
  username: ""

# Authorization (SpiceDB, ADR 0006). Either point `authz.endpoint` at a
# SpiceDB you operate, or set `spicedb.enabled` to run one in-chart. With
# neither, authorization is disabled (`apilens migrate` skips the schema).
authz:
  # External SpiceDB gRPC address (host:port). Must be empty when
  # spicedb.enabled is true.
  endpoint: ""
  # Dial without TLS (only for a plaintext in-cluster SpiceDB). Forced on for
  # the in-chart SpiceDB.
  insecure: false
  # How long a permission check result may be reused (Go duration; 0s = off).
  cacheTTL: 5s

# In-chart SpiceDB: one Deployment + Service; its datastore migrations run as
# an init container. The Postgres datastore URI (a separate database, e.g.
# postgres://apilens:PASS@pg-rw:5432/spicedb?sslmode=require) is read from the
# secret key `spicedb-datastore-uri`. For HA, run the SpiceDB operator instead
# and set `authz.endpoint`.
spicedb:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/authzed/spicedb
    tag: v1.57.0
    digest: "sha256:a170d372c9f6b921bb6849064df6ca3566dd5b174882c1a2c4300c2ae1d60efd"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Extra environment variables (SPICEDB_* flags) for the SpiceDB container.
  extraEnv: []

secrets:
  # Name of an existing Secret with keys: postgres-url, clickhouse-password,
  # valkey-password (optional), session-secret (required when web is enabled),
  # identity-key-encryption-key (required when the all or identity role runs),
  # spicedb-preshared-key (required when authz is enabled),
  # spicedb-datastore-uri (required when spicedb.enabled).
  existingSecret: ""
  # Inline values for development ONLY (rendered into a chart-managed Secret
  # when existingSecret is empty).
  postgresUrl: ""
  clickhousePassword: ""
  valkeyPassword: ""
  # Encrypts the dashboard session cookie (at least 32 characters).
  sessionSecret: ""
  # Identity key encryption key: 32 random bytes, base64
  # (openssl rand -base64 32). Encrypts signing keys and TOTP secrets at rest.
  identityKeyEncryptionKey: ""
  # SpiceDB preshared key (openssl rand -hex 32).
  spicedbPresharedKey: ""
  # Postgres URI of SpiceDB's own database (spicedb.enabled only).
  spicedbDatastoreUri: ""

# Database migrations run as a Helm hook Job (pre-install, pre-upgrade). With
# spicedb.enabled the SpiceDB schema is applied by a second hook Job
# (post-install, post-upgrade), once the in-chart SpiceDB exists.
migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

# Web UI (Next.js, apps/ui).
web:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/apilens/web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  # APILENS_API_URL: backend base URL the UI server calls. Empty = the
  # in-cluster Service of `ingress.ingestRole`.
  apiUrl: ""
  # APILENS_PUBLIC_URL: origin users open the dashboard at. Empty = derived
  # from `ingress.webHost` (https when `ingress.tls` is set).
  publicUrl: ""
  extraEnv: []

# AI/ML service (Python). Disabled until it ships real features (M4).
ai:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/apilens/ai
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Host for the dashboard.
  webHost: ""
  # Host for SDK ingest + API (routed to `ingestRole`).
  ingestHost: ""
  ingestRole: all
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Applied to every role Deployment. When empty and defaultTopologySpread is
# true, pods are spread across zones and nodes (best effort).
topologySpreadConstraints: []
defaultTopologySpread: true

metrics:
  # Adds prometheus.io/* scrape annotations to role pods.
  podAnnotations: true
