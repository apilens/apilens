{{- if not .Values.secrets.existingSecret }}
{{- $data := dict
  "postgres-url" .Values.secrets.postgresUrl
  "clickhouse-password" .Values.secrets.clickhousePassword
  "valkey-password" .Values.secrets.valkeyPassword
  "session-secret" .Values.secrets.sessionSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apilens.secretName" . }}
  labels:
    {{- include "apilens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if .Values.migrations.enabled }}
---
# Copy for the migrate hook: pre-install hooks run before regular resources
# exist, so the Job cannot depend on the Secret above on first install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apilens.hookSecretName" . }}
  labels:
    {{- include "apilens.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
