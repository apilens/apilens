{{- if .Values.ai.enabled }}
{{- $ctx := dict "root" . "component" "ai" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apilens.fullname" . }}-ai
  labels:
    {{- include "apilens.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  replicas: {{ .Values.ai.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "apilens.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apilens.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "apilens.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ai
          image: {{ include "apilens.imageRef" (dict "image" .Values.ai.image "root" .) }}
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ai.port }}
              protocol: TCP
          {{- with .Values.ai.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apilens.fullname" . }}-ai
  labels:
    {{- include "apilens.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ai.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "apilens.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
