spring.application.name=apilens-example-spring
server.port=${PORT:8080}
spring.main.banner-mode=off
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Every apilens.* property can also be set as an APILENS_* environment
# variable (relaxed binding): APILENS_API_KEY, APILENS_APP_ID, APILENS_BASE_URL,
# APILENS_SAMPLE_RATE, APILENS_REDACT_BODY_FIELDS, ... EXAMPLE_POSTURE sets
# apilens.capture-profile (see ExampleApplication).
apilens.app-id=${APILENS_APP_ID:example-spring}
