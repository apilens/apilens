[project]
name = "apilens-ai"
version = "0.1.0"
description = "APILens AI/ML service: agents, anomaly baselines and forecasting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    # Floor pinned explicitly for the 2026 form-limit bypass fix.
    "starlette>=1.3.1",
    "pydantic-settings>=2.11",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "pytest>=8",
    # starlette.testclient transport (httpx is deprecated there since starlette 1.x).
    "httpx2>=2.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apilens_ai"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom.
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
