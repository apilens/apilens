# https://taskfile.dev — the one front door for local development and CI.
#   go -C tools install tool   (or `task tools`) puts task/buf/golangci-lint in ./bin
version: "3"

vars:
  BIN: "{{.ROOT_DIR}}/bin"
  SQLC_IMAGE: sqlc/sqlc:1.31.1@sha256:70f53171d27b2424e9358869975455a6e955a5aa8e58a998a270a6e34e525537
  ZED_IMAGE: ghcr.io/authzed/zed:v1.2.1@sha256:075810514ce2b5b494240b8015dd1ee686b47c00e238a5925eaf5f5fe3c8d02e
  DEV_COMPOSE: deploy/compose/compose.dev.yaml
  E2E_COMPOSE: docker compose --env-file deploy/compose/ci.env -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml
  EXAMPLES_COMPOSE: "{{.E2E_COMPOSE}} -f deploy/compose/compose.examples.yaml --profile examples"

# Defaults matching deploy/compose/compose.dev.yaml (local only).
env:
  APILENS_POSTGRES__URL: '{{.APILENS_POSTGRES__URL | default "postgres://apilens:apilens@localhost:5432/apilens?sslmode=disable"}}'
  APILENS_CLICKHOUSE__ADDR: '{{.APILENS_CLICKHOUSE__ADDR | default "localhost:9000"}}'
  APILENS_CLICKHOUSE__PASSWORD: '{{.APILENS_CLICKHOUSE__PASSWORD | default "apilens"}}'
  APILENS_VALKEY__ADDR: '{{.APILENS_VALKEY__ADDR | default "localhost:6379"}}'
  APILENS_LOG__FORMAT: '{{.APILENS_LOG__FORMAT | default "text"}}'
  # Development-only identity key, base64("dev-only-identity-kek-0123456789").
  APILENS_IDENTITY__KEY_ENCRYPTION_KEY: '{{.APILENS_IDENTITY__KEY_ENCRYPTION_KEY | default "ZGV2LW9ubHktaWRlbnRpdHkta2VrLTAxMjM0NTY3ODk="}}'
  APILENS_AUTHZ__ENDPOINT: '{{.APILENS_AUTHZ__ENDPOINT | default "localhost:50051"}}'
  APILENS_AUTHZ__PRESHARED_KEY: '{{.APILENS_AUTHZ__PRESHARED_KEY | default "apilens-dev-key"}}'
  APILENS_AUTHZ__INSECURE: '{{.APILENS_AUTHZ__INSECURE | default "true"}}'
  # Mail goes to the dev Mailpit (UI at http://localhost:8025).
  APILENS_EMAIL__PROVIDER: '{{.APILENS_EMAIL__PROVIDER | default "smtp"}}'
  APILENS_EMAIL__HOST: '{{.APILENS_EMAIL__HOST | default "localhost"}}'
  APILENS_EMAIL__PORT: '{{.APILENS_EMAIL__PORT | default "1025"}}'
  APILENS_EMAIL__TLS: '{{.APILENS_EMAIL__TLS | default "none"}}'
  APILENS_EMAIL__FROM: '{{.APILENS_EMAIL__FROM | default "APILens <no-reply@apilens.local>"}}'

tasks:
  default:
    cmds: ["task --list"]
    silent: true

  tools:
    desc: Install Go tools (task, buf, golangci-lint, govulncheck) into ./bin
    sources: [tools/go.mod, tools/go.sum]
    generates: ["{{.BIN}}/buf", "{{.BIN}}/golangci-lint"]
    cmds:
      - GOBIN={{.BIN}} go -C tools install tool

  bootstrap:
    desc: One-time setup — tools, JS/Python deps, dev datastores, schema, seed data
    cmds:
      - task: tools
      - pnpm install
      - uv sync --all-packages
      - task: up
      - task: migrate
      - task: seed
      - cmd: |
          echo
          echo "Ready. Run 'task dev', then sign up at http://localhost:3200/sign-up, codes at http://localhost:8025"
        silent: true

  # ---------------------------------------------------------------- codegen
  gen:
    desc: Regenerate everything committed as generated code
    cmds:
      - task: gen:proto
      - task: gen:sqlc
      - task: gen:openapi

  gen:proto:
    desc: protobuf -> internal/gen/pb (local plugins, no BSR)
    deps: [tools]
    sources: ["proto/**/*.proto", buf.yaml, buf.gen.yaml]
    cmds:
      - rm -rf internal/gen/pb
      - "{{.BIN}}/buf generate"

  gen:sqlc:
    desc: SQL queries -> internal/controlplane/store/db, internal/identity/store/db
    sources: ["internal/controlplane/store/queries/*.sql", "internal/identity/store/queries/*.sql","internal/migrations/postgres/*.sql", sqlc.yaml]
    cmds:
      - docker run --rm -u "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/src" -w /src {{.SQLC_IMAGE}} generate

  gen:openapi:
    desc: Dump the Huma OpenAPI spec to api/openapi
    cmds:
      - mkdir -p api/openapi
      - go run ./cmd/apilens openapi > api/openapi/apilens.v1.json

  openapi:check:
    desc: Fail when api/openapi/apilens.v1.json differs from the Huma operations, or a query operation is undocumented
    cmds:
      - go run ./cmd/apilens openapi | diff -u api/openapi/apilens.v1.json - || (echo "api/openapi/apilens.v1.json is out of date; run 'task gen:openapi'" >&2; exit 1)
      - go test -count=1 -run TestOpenAPIDocumentsQueryOperations ./internal/query/

  # ------------------------------------------------------------- quality
  lint:
    desc: All linters
    cmds:
      - task: lint:go
      - task: lint:proto
      - task: lint:web
      - task: lint:ai
      - task: lint:authz

  lint:go:
    deps: [tools]
    cmds:
      - "{{.BIN}}/golangci-lint run ./..."
      - "{{.BIN}}/govulncheck ./..."

  lint:proto:
    deps: [tools]
    cmds:
      - "{{.BIN}}/buf lint"
      - "{{.BIN}}/buf format -d --exit-code"

  lint:web:
    cmds:
      - pnpm --filter ui typecheck

  lint:authz:
    desc: Validate the SpiceDB schema against its assertions (zed validate)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/authz:/authz:ro" -w /authz {{.ZED_IMAGE}} validate schema.validation.yaml

  lint:ai:
    dir: apps/ai
    cmds:
      - uv run ruff check
      - uv run ruff format --check
      - uv run pyright

  test:
    desc: Go unit tests
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Go integration tests against real Postgres/ClickHouse/Valkey (needs Docker)
    cmds:
      - go test -race -count=1 -p 1 -tags=integration ./internal/...

  test:e2e:
    desc: Black-box tests against a running stack (task e2e:up first)
    cmds:
      - go test -count=1 -tags=e2e ./test/e2e/... {{.CLI_ARGS}}

  e2e:up:
    desc: Build images and start the self-host stack with CI settings
    cmds:
      - docker compose --env-file deploy/compose/ci.env -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml up -d --build --wait apilens web

  e2e:down:
    cmds:
      - docker compose --env-file deploy/compose/ci.env -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml down -v

  # -------------------------------------------------------- example apps
  # FastAPI, Express and Spring apps instrumented with the SDKs from this repo
  # (examples/, deploy/compose/compose.examples.yaml), run against the e2e
  # stack. Posture: APILENS_EXAMPLES_POSTURE=off|metadata|redacted|full.
  examples:up:
    desc: "Start the e2e stack plus the FastAPI/Express/Spring example apps (posture: APILENS_EXAMPLES_POSTURE)"
    cmds:
      - task: e2e:up
      - |
        set -eu
        for app in example-fastapi example-express example-spring; do
          out="$({{.E2E_COMPOSE}} run --rm --no-deps --entrypoint /apilens apilens seed -app-slug "$app" | tail -n 1)"
        done
        key="$(printf '%s' "$out" | sed -n 's/.*"api_key":"\([^"]*\)".*/\1/p')"
        read_key="$(printf '%s' "$out" | sed -n 's/.*"read_key":"\([^"]*\)".*/\1/p')"
        if [ -z "$key" ]; then echo "seed did not return an api_key: $out" >&2; exit 1; fi
        printf 'APILENS_EXAMPLES_API_KEY=%s\nAPILENS_EXAMPLES_READ_KEY=%s\n' "$key" "$read_key" > examples/.env
        APILENS_EXAMPLES_API_KEY="$key" {{.EXAMPLES_COMPOSE}} up -d --build --wait --wait-timeout 600
        echo "Examples up (posture ${APILENS_EXAMPLES_POSTURE:-full}); keys in examples/.env. Try: task examples:smoke"

  examples:smoke:
    desc: Hit every example endpoint once and check the status codes
    cmds:
      - bash examples/smoke.sh {{.CLI_ARGS}}

  # Masked fields never reach ClickHouse (test/e2e/privacy_e2e_test.go): the
  # example apps first with client masking patterns for e2e_pii and no
  # server-side policy, then without the client patterns behind the
  # project's server-side privacy policy. Any seeded value in any table fails.
  test:e2e:privacy:
    desc: "e2e: PII seeded through the three SDKs' example apps reaches ClickHouse masked (SDK masking, then server-side policy)"
    cmds:
      - APILENS_EXAMPLES_REDACT_QUERY_PARAMS='^e2e_pii$' APILENS_EXAMPLES_REDACT_HEADERS='^x-e2e-pii$' APILENS_EXAMPLES_REDACT_BODY_FIELDS='^e2e_pii$' "{{.TASK_EXE}}" examples:up
      - task: e2e:privacy:run
        vars: {MODE: sdk}
      - APILENS_EXAMPLES_REDACT_QUERY_PARAMS= APILENS_EXAMPLES_REDACT_HEADERS= APILENS_EXAMPLES_REDACT_BODY_FIELDS= "{{.TASK_EXE}}" examples:up
      - task: e2e:privacy:run
        vars: {MODE: server}

  e2e:privacy:run:
    internal: true
    cmds:
      - |
        set -eu
        set -a; . examples/.env; set +a
        APILENS_E2E_PRIVACY={{.MODE}} \
        APILENS_E2E_BASE_URL="http://127.0.0.1:${APILENS_INGEST_PORT:-8080}" \
        APILENS_E2E_API_KEY="$APILENS_EXAMPLES_API_KEY" \
        APILENS_E2E_READ_KEY="$APILENS_EXAMPLES_READ_KEY" \
        APILENS_E2E_APP=example-fastapi \
        APILENS_E2E_CLICKHOUSE_HTTP=http://127.0.0.1:8123 \
        APILENS_E2E_CLICKHOUSE_USER=apilens \
        APILENS_E2E_CLICKHOUSE_PASSWORD=ci-clickhouse \
        APILENS_E2E_MAILPIT_URL="http://127.0.0.1:${APILENS_E2E_MAILPIT_PORT:-8025}" \
        APILENS_E2E_EXAMPLES="http://127.0.0.1:${APILENS_EXAMPLES_FASTAPI_PORT:-18001},http://127.0.0.1:${APILENS_EXAMPLES_EXPRESS_PORT:-18002},http://127.0.0.1:${APILENS_EXAMPLES_SPRING_PORT:-18003}" \
          go test -count=1 -tags=e2e ./test/e2e/... -run '^TestExamplePrivacy$' -v

  # Sampled-out requests still count; excluded paths never arrive
  # (test/e2e/sampling_e2e_test.go): the example apps at sample rate 0.1 in an
  # environment of their own, 1000 requests and 100 health checks per app.
  test:e2e:sampling:
    desc: "e2e: at sample rate 0.1 every request counts in /traffic/summary, ~10% keep detail, health checks never arrive"
    cmds:
      - |
        set -eu
        env_name="e2e-sampling-$(date +%s)"
        APILENS_EXAMPLES_SAMPLE_RATE=0.1 APILENS_EXAMPLES_ENVIRONMENT="$env_name" "{{.TASK_EXE}}" examples:up
        set -a; . examples/.env; set +a
        APILENS_E2E_SAMPLING_ENV="$env_name" \
        APILENS_E2E_BASE_URL="http://127.0.0.1:${APILENS_INGEST_PORT:-8080}" \
        APILENS_E2E_API_KEY="$APILENS_EXAMPLES_API_KEY" \
        APILENS_E2E_READ_KEY="$APILENS_EXAMPLES_READ_KEY" \
        APILENS_E2E_APP=example-fastapi \
        APILENS_E2E_CLICKHOUSE_HTTP=http://127.0.0.1:8123 \
        APILENS_E2E_CLICKHOUSE_USER=apilens \
        APILENS_E2E_CLICKHOUSE_PASSWORD=ci-clickhouse \
        APILENS_E2E_EXAMPLES="http://127.0.0.1:${APILENS_EXAMPLES_FASTAPI_PORT:-18001},http://127.0.0.1:${APILENS_EXAMPLES_EXPRESS_PORT:-18002},http://127.0.0.1:${APILENS_EXAMPLES_SPRING_PORT:-18003}" \
          go test -count=1 -tags=e2e ./test/e2e/... -run '^TestExampleSampling$' -v

  # Failure drills (test/e2e/drills_e2e_test.go): the example apps send to a
  # fault proxy the test runs on the host (port 18090), which takes ingest
  # down, answers 5xx, then 429 with Retry-After, then 403 project_paused;
  # the apps must stay fast, count the drops (a paused project's batches are
  # dropped, never retried) and flush without duplicates once ingest is back.
  test:e2e:drills:
    desc: "e2e: failure drills (ingest down, 5xx, 429 with Retry-After, project paused) through the three SDKs' example apps"
    cmds:
      - |
        set -eu
        env_name="e2e-drills-$(date +%s)"
        port="${APILENS_E2E_DRILL_PROXY_PORT:-18090}"
        APILENS_EXAMPLES_INGEST_URL="http://host.docker.internal:$port/v1" APILENS_EXAMPLES_ENVIRONMENT="$env_name" "{{.TASK_EXE}}" examples:up
        set -a; . examples/.env; set +a
        APILENS_E2E_DRILLS_ENV="$env_name" \
        APILENS_E2E_DRILL_PROXY_ADDR="0.0.0.0:$port" \
        APILENS_E2E_BASE_URL="http://127.0.0.1:${APILENS_INGEST_PORT:-8080}" \
        APILENS_E2E_API_KEY="$APILENS_EXAMPLES_API_KEY" \
        APILENS_E2E_READ_KEY="$APILENS_EXAMPLES_READ_KEY" \
        APILENS_E2E_APP=example-fastapi \
        APILENS_E2E_CLICKHOUSE_HTTP=http://127.0.0.1:8123 \
        APILENS_E2E_CLICKHOUSE_USER=apilens \
        APILENS_E2E_CLICKHOUSE_PASSWORD=ci-clickhouse \
        APILENS_E2E_EXAMPLES="http://127.0.0.1:${APILENS_EXAMPLES_FASTAPI_PORT:-18001},http://127.0.0.1:${APILENS_EXAMPLES_EXPRESS_PORT:-18002},http://127.0.0.1:${APILENS_EXAMPLES_SPRING_PORT:-18003}" \
          go test -count=1 -tags=e2e ./test/e2e/... -run '^TestIngestFailureDrills$' -v -timeout 30m

  examples:down:
    desc: Stop the example apps (the e2e stack keeps running; task e2e:down stops it)
    cmds:
      - APILENS_EXAMPLES_API_KEY=unused {{.EXAMPLES_COMPOSE}} rm -sf example-fastapi example-express example-spring

  bench:examples:
    desc: "SDK overhead on the example apps: off vs metadata/redacted/full at 1 KB/32 KB (task examples:up first; docs/benchmarks/examples-overhead.md)"
    cmds:
      - bash tools/appbench/bench.sh {{.CLI_ARGS}}

  # ------------------------------------------------------------- run
  build:
    desc: Build the apilens binary into ./bin
    cmds:
      - go build -trimpath -o {{.BIN}}/apilens ./cmd/apilens

  docker:build:
    desc: Build the apilens image
    cmds:
      - docker build -f deploy/docker/Dockerfile -t ghcr.io/apilens/apilens:dev .

  up:
    desc: Start dev datastores (Postgres, ClickHouse, Valkey, SpiceDB, Mailpit) on localhost
    cmds:
      - docker compose -f {{.DEV_COMPOSE}} up -d --wait

  down:
    desc: Stop dev datastores
    cmds:
      - docker compose -f {{.DEV_COMPOSE}} down

  migrate:
    desc: Apply Postgres and ClickHouse migrations and the SpiceDB schema to the dev datastores
    cmds:
      - go run ./cmd/apilens migrate

  seed:
    desc: Create a dev org/project/app and print an ingest key
    cmds:
      - go run ./cmd/apilens seed {{.CLI_ARGS}}

  run:
    desc: Run all roles against the dev datastores
    cmds:
      - go run ./cmd/apilens -target=all

  dev:
    desc: Datastores + hot-reloading backend + web + AI (mprocs)
    cmds:
      - pnpm exec mprocs

  loadgen:
    desc: "Load test the edge, e.g. task loadgen -- -key apl_live_... -rate 5000"
    cmds:
      - go -C tools run ./loadgen {{.CLI_ARGS}}

  helm:lint:
    cmds:
      - helm lint --strict deploy/helm/apilens
      - helm template apilens deploy/helm/apilens > /dev/null
