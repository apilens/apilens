# pnpm workspace: every directory under apps/ and packages/ with a
# package.json (apps/web, packages/sdk-typescript). The Go backend
# (repo root go.mod) and Python services (uv workspace, root pyproject.toml)
# live in the same repo but are invisible to pnpm.
packages:
  - "apps/*"
  - "packages/*"

# Supply-chain guard: don't resolve versions published less than 3 days ago
# (minutes). Gives the registry time to pull compromised releases.
minimumReleaseAge: 4320

# pnpm 11 blocks dependency install scripts by default; allow only these.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Security floors for transitive dependencies flagged by osv-scanner
# (2026-10-22). Remove an entry once every dependent requires a fixed version.
overrides:
  "baseline-browser-mapping": "^2.11.0"
  "body-parser@2": "^2.3.0"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@5": "^5.0.12"
  "browserslist": "^4.28.7"
  "esbuild": "^0.28.1"
  "form-data@4": "^4.0.6"
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.18"
  "postcss": "^8.5.23"
  "proxy-addr": "^2.0.8"
  "qs": "^6.16.0"
  "source-map-js": "^1.2.2"
  "vite@7": "^7.3.7"
