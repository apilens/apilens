# `task dev` — everything for local development in one terminal UI.
procs:
  datastores:
    shell: docker compose -f deploy/compose/compose.dev.yaml up
  backend:
    shell: go run github.com/air-verse/air@v1.67.4 -c .air.toml
    env:
      APILENS_POSTGRES__URL: postgres://apilens:apilens@localhost:5432/apilens?sslmode=disable
      APILENS_CLICKHOUSE__ADDR: localhost:9000
      APILENS_CLICKHOUSE__PASSWORD: apilens
      APILENS_VALKEY__ADDR: localhost:6379
      APILENS_LOG__FORMAT: text
      # Development-only identity key; never reuse it anywhere else.
      APILENS_IDENTITY__KEY_ENCRYPTION_KEY: ZGV2LW9ubHktaWRlbnRpdHkta2VrLTAxMjM0NTY3ODk=
      APILENS_IDENTITY__PUBLIC_UI_URL: http://localhost:3200
      APILENS_IDENTITY__WEBAUTHN__ORIGINS: http://localhost:3200
  web:
    shell: pnpm --filter ui dev
    env:
      APILENS_API_URL: http://localhost:8080
      # Development-only key; never reuse it anywhere else.
      SESSION_SECRET: dev-only-session-secret-0123456789abcdef
      APILENS_PUBLIC_URL: http://localhost:3200
  ai:
    shell: uv run --package apilens-ai uvicorn apilens_ai.main:app --reload --port 8000
